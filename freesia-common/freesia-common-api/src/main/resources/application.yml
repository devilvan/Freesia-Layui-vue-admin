---
spring:
  data:
    redis:
      repositories:
        enabled: false
---
spring:
  cache:
    type: redis
    redis:
      # 过期时间（毫秒）
      time-to-live: 86400000
---
spring:
  mvc:
    pathmatch:
      matching-strategy: PATH_PATTERN_PARSER
---
spring:
  thymeleaf:
    check-template-location: false
---
spring:
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 所有文件上传总大小
      max-request-size: 100MB
---
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      lettuce:
        pool:
          # 最大活动数量
          max-active: 8
          # 当池耗尽时，在引发异常之前，连接分配应该阻塞的最长时间。使用负值可以无限期阻止。
          max-wait: -1
          # 最大闲置时间，单位：s
          max-idle: 500
          # 超时关闭时间
        shutdown-timeout: 0
---
spring:
  jpa:
    database: MYSQL
    database-platform: org.hibernate.dialect.MySQL8Dialect
    # 有p6spy了就可以不用你了
    show-sql: false
    open-in-view: true
    hibernate:
      # 禁止 Hibernate 启动时自动执行 DDL（如 alter table），避免擅自修改表结构
      # JPA 查询/关系映射功能不受影响；表结构变更应通过 flyway/liquibase 或手工 SQL 管理
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          # 批量保存时重写SQL语句，每批1000条提交
          batch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # 定义JPA的SQL拦截，没有需要可以不创建
#        session_factory:
#          statement_inspector: com.freesia.interceptor.JpaDataPermissionInterceptor
        generate_statistics: false
# Mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    lazy-loading-enabled: true
    local-cache-scope: SESSION
  # 启动时是否检查 MyBatis XML 文件的存在，默认不检查
  checkConfigLocation: false
  global-config:
    banner: false
    worker-id: ${random.int(1,31)}
    datacenter-id: ${random.int(1,31)}
    db-config:
      id-type: ASSIGN_ID
# 日志相关
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
---
sse:
  enabled: true
  path: /resource/sse
---
