project:
  version: @freesia.version@
---
spring:
  profiles:
    # 根据当前活跃环境指定对应的 application文件
    active: @profiles.active@
---
server:
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      force: true
---
spring:
  datasource:
    # ========== MySQL 数据源（主数据源，供 MyBatis-Plus 使用）==========
    mysql:
      # ⚠️ 注意：P6Spy 的配置方式需要调整为下面这种写法
      driver-class-name: com.p6spy.engine.spy.P6SpyDriver
      # P6Spy 的 URL 格式：jdbc:p6spy:真实驱动://...
      jdbc-url: jdbc:p6spy:mysql://localhost:3306/freesia?useUnicode=true&useSSL=false&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&generateSimpleParameterMetadata=true&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
      username: root
      password: lklpos
      type: com.alibaba.druid.pool.DruidDataSource
      druid:
        # 初始连接数
        initial-size: 5
        # 最小连接池数量
        min-idle: 5
        # 最大连接池数量
        max-active: 20
        # 配置检测连接是否有效
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: true
        test-on-return: false
        # 开启keepAlive，定期检测空闲连接
        keep-alive: true
        # 空闲连接被驱逐前的最小空闲时间
        min-evictable-idle-time-millis: 300000
        # 打开PSCache
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        # 连接池过滤器配置
        filter:
          stat:
            enabled: true
            log-slow-sql: true
            slow-sql-millis: 2000
            merge-sql: true
          wall:
            config:
              multi-statement-allow: true
        use-global-data-source-stat: true
        connect-properties:
          druid.stat.mergeSql: true
          druid.stat.slowSqlMillis: 5000
          useCursorFetch: true
          defaultFetchSize: 1000
        # Druid 监控页面（只有 MySQL 配置，因为通常只需一个监控入口）
        stat-view-servlet:
          enabled: true
          login-username: Devilvan
          login-password: 741258963hjkl
          reset-enable: false
          url-pattern: /druid/*
          allow: 127.0.0.1
        web-stat-filter:
          url-pattern: /*
          exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

    # ========== PostgreSQL 数据源（供 JPA 使用）==========
    pgsql:
      # ⚠️ 如果想对 PostgreSQL 也用 P6Spy，需要单独配置，但通常不推荐（日志量会翻倍）
      # 方案A：不用 P6Spy，直接使用原生驱动
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://43.139.239.186:5432/freesia_dev?currentSchema=public
      username: postgres
      password: WjwXYjl0057Urlbound
      type: com.alibaba.druid.pool.DruidDataSource
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: true
        test-on-return: false
        keep-alive: true
        min-evictable-idle-time-millis: 300000
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filter:
          stat:
            enabled: true
            log-slow-sql: true
            slow-sql-millis: 2000
            merge-sql: true
        use-global-data-source-stat: true
        connect-properties:
          druid.stat.mergeSql: true
          druid.stat.slowSqlMillis: 5000
---
spring:
  data:
    redis:
      repositories:
        enabled: false
---
spring:
  cache:
    type: redis
    redis:
      # 过期时间（毫秒）
      time-to-live: 86400000
---
spring:
  mvc:
    pathmatch:
      matching-strategy: PATH_PATTERN_PARSER
---
spring:
  thymeleaf:
    check-template-location: false
---
spring:
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 所有文件上传总大小
      max-request-size: 100MB
---
spring:
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        # 最大活动数量
        max-active: 8
        # 当池耗尽时，在引发异常之前，连接分配应该阻塞的最长时间。使用负值可以无限期阻止。
        max-wait: -1
        # 最大闲置时间，单位：s
        max-idle: 500
        # 超时关闭时间
      shutdown-timeout: 0
---
spring:
  jpa:
    database: MYSQL
    database-platform: org.hibernate.dialect.MySQL8Dialect
    # 有p6spy了就可以不用你了
    show-sql: false
    open-in-view: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        jdbc:
          # 批量保存时重写SQL语句，每批1000条提交
          batch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        # 定义JPA的SQL拦截，没有需要可以不创建
#        session_factory:
#          statement_inspector: com.freesia.interceptor.JpaDataPermissionInterceptor
        generate_statistics: false
# Mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    lazy-loading-enabled: true
    local-cache-scope: SESSION
  # 启动时是否检查 MyBatis XML 文件的存在，默认不检查
  checkConfigLocation: false
  global-config:
    banner: false
    worker-id: ${random.int(1,31)}
    datacenter-id: ${random.int(1,31)}
    db-config:
      id-type: ASSIGN_ID
# 日志相关
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
---
sse:
  enabled: true
  path: /resource/sse
---
mail:
  enabled: true
  host: smtp.qq.com
  port: 465
  # 是否需要用户名密码验证
  auth: true
  # 发送方，遵循RFC-822标准
  from: evad.bliss@qq.com
  # 用户名（注意：如果使用foxmail邮箱，此处user为qq号）
  user: evad.bliss@qq.com
  # 密码（注意，某些邮箱需要为SMTP服务单独设置密码，详情查看相关帮助）
  pass: eqspltjrxduubcid
  # 使用 STARTTLS安全连接，STARTTLS是对纯文本通信协议的扩展。
  starttlsEnable: true
  # 使用SSL安全连接
  sslEnable: true
  # SMTP超时时长，单位毫秒，缺省值不超时
  timeout: 0
  # Socket连接超时值，单位毫秒，缺省值不超时
  connectionTimeout: 0