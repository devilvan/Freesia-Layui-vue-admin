server:
  port: 8570
---
spring:
  application:
    name: freesia-admin
    admin:
      enabled: true
---
spring:
  servlet:
    multipart:
      # 支持上传大图进行拼豆像素化处理
      max-file-size: 20MB
      max-request-size: 20MB
---
spring:
  boot:
    admin:
      server:
        enabled: true
      #      context-path: /spring-admin
      ui:
        brand: "<img src=\"assets/img/icon-spring-boot-admin.svg\"><span>Freesia Spring Boot Admin</span>"
      client:
        enabled: false
        url: http://localhost:8570
        instance:
          service-host-type: IP
          metadata:
            username: ${spring.boot.admin.client.username}
            userpassword: ${spring.boot.admin.client.password}
        username: ${spring.security.user.name}
        password: ${spring.security.user.password}
---
spring:
  security:
    user:
      name: @monitor.username@
      password: @monitor.password@
---
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
---
freesia:
  crypt:
    # AES密钥轮换周期（分钟），前端定时重取间隔需小于该值
    aes-rotation-minutes: 60
    # 上一把密钥宽限期（分钟）
    aes-grace-minutes: 10
  web:
    common:
      # 是否初始化系统配置
      init-sys-config: true
      # 是否初始化数据字典
      init-sys-dict: true
      # 是否初始化后端公钥
      init-secret-key: true
      # 是否初始化默认图标模板
      init-default-common-icon-template-flag: true
    menu:
      path:
        - workSpace
        - worldClock
        - enrollee
        - profile
        - message
        - accounts
        - accountsDashboard
        - mine
        - accountsDashboard
        - budget
        - billing
        - bill
        - common
        - iconTemplate
      permission:
        - account:cost:add
        - account:cost:edit
        - account:cost:delete
        - common:iconTemplate:setupDetail
        - common:iconTemplate:addGrouping
        - common:iconTemplate:addIcon
    tenant:
      enabled: true
      tenant-column: TENANT_ID
      ignore-table:
        - SYS_TENANT
        - SYS_USER
        - SYS_MENU
        - SYS_DEPT
        - SYS_ROLE
        - SYS_ROLE_MENU
        - SYS_ROLE_DEPT
        - SYS_TENANT_USER
        - SYS_USER_ROLE
        - SYS_DICT_KEY
        - SYS_DICT_VALUE
        - URL_CONFIG
        - SYS_CONFIG
        - SYS_OSS
        - SYS_OSS_CONFIG
        - DATESERIES
        - ACCOUNT_COST
        - ACCOUNT_COST_USER_ALLOC
        - ACCOUNT_BUDGET
        - ACCOUNT_REPORT
        - ACCOUNT_REPORT_STRATEGY
        - COMMON_ICON
        - COMMON_ICON_TEMPLATE_HEADER
        - COMMON_ICON_TEMPLATE_DETAIL
        - SYS_NOTICE
        - WORLD_CLOCK_CITY
        - COMMON_TODO
        - SYS_CLIENT
        - SYS_THIRDPARTY_AUTH
        - SYS_COLUMN_HEADER
        - SYS_COLUMN_DETAIL
        - SYS_COLUMN_MIDDLE
        - CHAT_CONVERSATION
        - CHAT_MESSAGE
  # RAG 知识库检索配置
  rag:
    # 相似度阈值(0~1)：低于该相似度的检索片段视为无关，不注入对话上下文。
    # 调低更易命中知识库（但可能混入无关内容），调高更严格（可能过滤掉部分相关片段）。
    similarity-threshold: 0.5
    swagger-url: ${RAG_SWAGGER_URL:http://localhost:${server.port}/v3/api-docs}
  xss:
    # 启用XSS过滤（默认true）
    enabled: true
    # 严格模式：移除所有HTML标签
    strict: false
    # 过滤请求体
    filter-body: true
    # 过滤请求头
    filter-headers: false
    exclude-urls: # 排除过滤的URL
      - /api/upload/**
      - /api/export/**
    exclude-headers: # 排除过滤的请求头
      - Authorization
      - Cookie
  fusebean:
    # 是否优先调用外部拼豆生成接口；false 时使用本地像素化算法兜底
    external-enabled: false
    # 外部拼豆生成接口地址（image-to-pindou 技能，契约未标准化，尽量自动解析响应中的图片）
    generate-url: ""
    # 调用外部接口的鉴权 Key（可选）
    api-key: ""
    # 外部接口超时时间（秒）
    request-timeout-seconds: 120
    # 图纸网格最大边长（格子数）
    grid-size: 50
    # 最大颜色数
    max-colors: 18
    # 图纸每格渲染像素大小
    cell-size: 14
    # 像素预览图每格渲染像素大小
    preview-cell-size: 10
    # 是否启用本地 image-to-pindou skill 调用链
    skill:
      enabled: true
      # skill 安装目录：优先仓库内置目录；user.dir 定位失败时自动向上查找，最后回退到 Codex 目录
      root: ${user.dir}/freesia-web/freesia-web-fusebean/skills/image-to-pindou
      # 本地执行命令
      node-command: node
      # skill 输出风格
      style: bead
      # 是否移除背景
      background: keep
      # skill 渲染输出像素大小
      cell-px: 24
---
login.password:
  # 密码最大错误次数
  maxRetryCount: 5
  # 密码锁定时间（默认10分钟 Duration）
  lockTime: 10M
  # 初始化密码
  init-password: 123456
---
# 生成验证码
captcha:
  type: CALCULATE
  strategy: SHEAR
  numberLength: 1
  charLength: 4
---
spring:
  messages:
    # 引入不同模块的i18n messages文件，逗号分隔
    basename: i18n/messages_account,i18n/messages_common,i18n/messages,i18n/messages_common_service
    encoding: UTF-8
---
# Sa-Token配置
sa-token:
  # 打印日志
  is-log: false
  # 打印彩色日志
  is-color-log: false
  # 启动不打印banner
  is-print: false
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期 设为一天 (必定过期) 单位: 秒
  timeout: 86400
  # 多端不同 token 有效期 可查看 USecurity.loginByDevice 方法自定义
  # token最低活跃时间 (指定时间无操作就过期) 单位: 秒
  active-timeout: 43200
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: true
  # 是否尝试从header里读取token
  is-read-header: true
  # 是否尝试从cookie里读取token
  is-read-cookie: false
  # token前缀
  token-prefix: "Bearer"
  # jwt秘钥
  jwt-secret-key: DoYouLikeWhatYouSee?
---
# security配置
security:
  # 排除路径
  excludes:
    # 静态资源
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    # 公共路径
    - /favicon.ico
    - /error
    # swagger 文档配置
    - /*/api-docs
    - /*/api-docs/**
    # actuator 监控配置
    - /actuator
    - /actuator/**
    # OAuth 单点登录（无需认证）
    - /api/sysLoginController/oauth/**
    # 二维码扫码登录（generate + status 无需认证，bind 需认证）
    - /api/sysLoginController/qrcode/generate
    - /api/sysLoginController/qrcode/status/**
---
# 接口文档
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    # 添加该属性才能在刷新或重新打开标签时不会重置auth值
    persist-authorization: true
  info:
    title: Devilvan's Freesia Admin Document
    description: Freesia后台管理系统_接口文档
    license:
      name: APACHE LICENSE VERSION 2.0
      url: https://www.apache.org/licenses/LICENSE-2.0.html
    version: '版本号: ${project.version}'
    termsOfService: 'http://localhost:${server.port}}'
    contact:
      name: Evad Devilvan
      email: evaddevilvan@outlook.com
      url: https://gitee.com/devilvan/freesia
  externalDocs:
    description: Git仓库地址
    url: https://gitee.com/devilvan/freesia
  components:
    # 鉴权方式配置
    security-schemes:
      apiKey:
        type: APIKEY
        in: HEADER
        name: ${sa-token.token-name}
      tenantId:
        type: APIKEY
        in: HEADER
        name: X-Tenant-Id
  group-configs:
    - group: 01. 登录、注册模块
      paths-to-match:
        - /api/sysLoginController/**
        - /api/sysRegistryController/**
    - group: 02. 用户模块
      paths-to-match: /api/sysUserController/**
    - group: 03. 角色模块
      paths-to-match: /api/sysRoleController/**
    - group: 04. 菜单模块
      paths-to-match: /api/sysMenuController/**
    - group: 05. 部门模块
      paths-to-match: /api/sysDeptController/**
    - group: 06. 字典模块
      paths-to-match: /api/sysDictController/**
    - group: 07. 操作日志模块
      paths-to-match: /api/sysSensitiveLogController/**
    - group: 08. 数据面板模块
      paths-to-match: /dashboard/**
    - group: 09. 基础服务模块
      paths-to-match: /common/**
    - group: 10. 租户模块
      paths-to-match: /api/sysTenantController/**
    - group: 11. 记账模块
      paths-to-match:
        - /api/account*/**
    - group: 12. 通用图标模块
      paths-to-match: /common/commonIcon*/**
    - group: 13. 通知公告模块
      paths-to-match: /api/sysNoticeController/**
    - group: 14. 系统授权模块
      paths-to-match:
        - /api/sysClientController/**
        - /api/sysThirdpartyAuthController/**
    - group: 15. AI聊天模块
      paths-to-match:
        - /api/chatConversationController/**
        - /api/chatMessageController/**
        - /api/chat/**
        - /api/rag/**
# knife4j的增强配置，不需要增强可以不配
#knife4j:
#  enable: true
#  setting:
#    language: zh_cn
gitee:
  commits:
    url: https://gitee.com/api/v5/repos/devilvan/freesia/commits
  oauth:
    url: https://gitee.com/oauth/token
    per-page: 20
---
xxl:
  job:
    admin:
      enabled: false
      ip: 127.0.0.1
      port: 8596
      # 调度中心部署跟地址 [选填]：如调度中心集群部署存在多个地址则用逗号分隔。
      # 执行器将会使用该地址进行"执行器心跳注册"和"任务结果回调"；为空则关闭自动注册；
      addresses: http://${xxl.job.admin.ip}:${xxl.job.admin.port}/xxl-job-admin
      # 执行器通讯TOKEN [选填]：非空时启用；
      accessToken:
    executor:
      # 执行器AppName [选填]：执行器心跳注册分组依据；为空则关闭自动注册
      appname:
      # 执行器注册 [选填]：优先使用该配置作为注册地址，为空时使用内嵌服务 ”IP:PORT“ 作为注册地址。
      #从而更灵活的支持容器类型执行器动态IP和动态映射端口问题。
      address:
      # 执行器IP [选填]：默认为空表示自动获取IP，多网卡时可手动设置指定IP，该IP不会绑定Host仅作为通讯实用；
      # 地址信息用于 "执行器注册" 和 "调度中心请求并触发任务"；
      ip:
      # 执行器端口号 [选填]：小于等于0则自动获取；默认端口为9999，单机部署多个执行器时，注意要配置不同执行器端口；
      port: 8598
      # 执行器运行日志文件存储磁盘路径 [选填] ：需要对该路径拥有读写权限；为空则使用默认路径；
      logpath: /logs/xxljob
      # 执行器日志文件保存天数 [选填] ： 过期日志自动清理, 限制值大于等于3时生效; 否则, 如-1, 关闭自动清理功能；
      logretentiondays: 7

---
# OAuth 第三方登录配置
oauth:
  providers:
    gitee:
      client-id: ${GITEE_CLIENT_ID:}
      client-secret: ${GITEE_CLIENT_SECRET:}
      redirect-uri: http://localhost:8570/api/sysLoginController/oauth/callback/gitee
      scopes:
        - user_info
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: http://localhost:8570/api/sysLoginController/oauth/callback/github
      scopes:
        - user:email
    wechat_open:
      client-id: ${WECHAT_OPEN_APP_ID:}
      client-secret: ${WECHAT_OPEN_APP_SECRET:}
      redirect-uri: http://localhost:8570/api/sysLoginController/oauth/callback/wechat_open
      scopes:
        - snsapi_login
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-v4-flash
---
spring:
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      # 指向 DeepSeek 的官方 API 地址
      # 注意: chat 由 pig-mesh 的 DeepSeekClient 直接调用, 不走 Spring AI 的 OpenAiChatModel
      # 此处 base-url 仅作为默认值, embedding 会在下面单独覆盖
      base-url: https://api.deepseek.com
      # Embedding 单独走阿里云 DashScope (DeepSeek 不提供 /v1/embeddings 接口, 调用会返回 404)
      embedding:
        api-key: ${ALIYUN_API_KEY:}
        # Spring AI 会自动在 base-url 后拼接 /v1/embeddings，因此这里填 compatible-mode（不带 /v1）；
        # 原 /api/v1 是 DashScope 原生接口路径，会被拼成 .../api/v1/v1/embeddings 导致 404。
        base-url: ${ALIYUN_OPEN_AI_BASE_URL:}
        options:
          # text-embedding-v3 仅支持 1024/768/512/256/128/64 维，1536 超出上限（需与 pgvector.dimensions 一致）
          model: text-embedding-v2
          dimensions: 1536
    vectorstore:
      pgvector:
        # 注意：Spring AI 1.1.x 的 PgVectorStoreProperties 没有 data-source 属性，
        # 无法通过配置指定数据源，自动配置只会用主数据源(MySQL)。
        # 这里的数据源绑定由 com.freesia.deepseek.config.PgVectorStoreConfig 完成。
        # 索引类型，HNSW性能较好
        index-type: HNSW
        # 距离算法，用余弦相似度
        distance-type: COSINE_DISTANCE
        # 向量维度必须与 embedding 输出维度一致（text-embedding-v2 = 1536）
        dimensions: 1536
        # 关键配置！让Spring AI自动帮你创建表
        initialize-schema: true
